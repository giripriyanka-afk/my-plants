<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 800" width="200" height="800">
  <!--
    Trailing pothos / heartleaf philodendron, used as a CSS mask, so only the
    alpha channel matters.

    A vine suits a backdrop better than a single blade: it is a line rather
    than a mass, so it traces the edge of the page instead of sitting as a
    pale field behind the cards.

    It runs the FULL height of the viewport and its last leaf straddles the
    bottom edge. An earlier version was 500 units tall and stopped around
    halfway down the screen, which read as cut off however the end was
    finished — the problem was never the tip, it was a vine hanging in empty
    space with nothing below it. A plant leaving the frame needs to leave it at
    an edge.

    The top is left open on purpose: that end sits above the viewport, behind
    the nav band, so it is never seen.

    Generated by scripts/gen-vine.mjs — leaves are hung off computed points on
    the stem, so editing the curve cannot leave a petiole floating. Stems are
    stroked rather than outlined; a mask samples rendered alpha, so a stroke is
    as good as a fill and keeps the file small.
  -->
  <defs>
    <!-- Cordate leaf: apex at the bottom, notch at the top where it meets the
         petiole. Two lobes curving into the notch, no straight segments. -->
    <path id="leaf" d="M0 40
                       C-20 24 -34 8 -34 -8
                       C-34 -24 -18 -32 -6 -22
                       C-3 -19 -1 -16 0 -12
                       C1 -16 3 -19 6 -22
                       C18 -32 34 -24 34 -8
                       C34 8 20 24 0 40 Z"/>
  </defs>

  <g fill="#000">
    <path fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"
          d="M100 0
             C130 60 70 110 96 170
             C122 230 62 280 88 340
             C114 400 66 450 92 510
             C118 570 64 620 90 680
             C110 730 76 772 90 800"/>

    <!-- Petioles. Each ends at its leaf's centre, so the join hides under the
         blade. -->
    <g fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
      <path d="M108.2 45 L152.2 53"/>
      <path d="M94 105 L52.2 112.6"/>
      <path d="M99.8 180 L140.3 187.4"/>
      <path d="M93.5 250 L53.9 257.2"/>
      <path d="M83.3 325 L122 332"/>
      <path d="M95.1 395 L57.7 401.8"/>
      <path d="M84.3 462 L120.4 468.6"/>
      <path d="M97.9 530 L62.7 536.4"/>
      <path d="M89.7 600 L124.1 606.2"/>
      <path d="M85.7 668 L52.7 674"/>
      <path d="M94.8 735 L126.5 740.8"/>
    </g>

    <use href="#leaf" transform="translate(152.2 53) rotate(37) scale(1)"/>
    <use href="#leaf" transform="translate(52.2 112.6) rotate(-42) scale(0.95)"/>
    <use href="#leaf" transform="translate(140.3 187.4) rotate(37) scale(0.92)"/>
    <use href="#leaf" transform="translate(53.9 257.2) rotate(-42) scale(0.9)"/>
    <use href="#leaf" transform="translate(122 332) rotate(37) scale(0.88)"/>
    <use href="#leaf" transform="translate(57.7 401.8) rotate(-42) scale(0.85)"/>
    <use href="#leaf" transform="translate(120.4 468.6) rotate(37) scale(0.82)"/>
    <use href="#leaf" transform="translate(62.7 536.4) rotate(-42) scale(0.8)"/>
    <use href="#leaf" transform="translate(124.1 606.2) rotate(37) scale(0.78)"/>
    <use href="#leaf" transform="translate(52.7 674) rotate(-42) scale(0.75)"/>
    <use href="#leaf" transform="translate(126.5 740.8) rotate(37) scale(0.72)"/>
    <use href="#leaf" transform="translate(86.7 788) rotate(9) scale(0.7)"/>
  </g>
</svg>
