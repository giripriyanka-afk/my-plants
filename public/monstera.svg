<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!--
    Stylised monstera deliciosa leaf, used as a CSS mask (see globals.css), so
    only the alpha channel matters — the fill colour here is irrelevant and the
    palette supplies the real one.

    The outline is one continuous path that swings OUT to each lobe tip and
    curves back IN toward the midrib, four times per side. Every segment is a
    cubic curve; there is not a straight edge in the blade.

    That is the whole point of this revision. The previous version cut the
    splits as straight-sided triangles out of an ellipse, and at backdrop
    opacity those hard wedges read as scattered pale polygons rather than
    foliage. Curved lobes keep the silhouette organic even when it is barely
    visible.

    Only the fenestrations are still cut through a mask — they are holes in the
    middle of the blade, so they cannot be part of the outline.
  -->
  <defs>
    <mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="250">
      <rect width="200" height="250" fill="#fff"/>
      <ellipse cx="80" cy="100" rx="7" ry="13" transform="rotate(-24 80 100)" fill="#000"/>
      <ellipse cx="120" cy="100" rx="7" ry="13" transform="rotate(24 120 100)" fill="#000"/>
      <ellipse cx="82" cy="152" rx="7" ry="12" transform="rotate(-14 82 152)" fill="#000"/>
      <ellipse cx="118" cy="152" rx="7" ry="12" transform="rotate(14 118 152)" fill="#000"/>
      <ellipse cx="87" cy="198" rx="5" ry="9" transform="rotate(-8 87 198)" fill="#000"/>
      <ellipse cx="113" cy="198" rx="5" ry="9" transform="rotate(8 113 198)" fill="#000"/>
    </mask>
  </defs>

  <g fill="#000">
    <path
      mask="url(#holes)"
      d="M100 14
         C116 30 130 42 138 58
         C130 66 118 71 106 75
         C128 81 150 93 161 111
         C147 117 127 121 108 124
         C136 131 158 146 167 168
         C151 173 129 177 110 180
         C132 190 146 202 149 218
         C133 226 115 230 100 231
         C85 230 67 226 51 218
         C54 202 68 190 90 180
         C71 177 49 173 33 168
         C42 146 64 131 92 124
         C73 121 53 117 39 111
         C50 93 72 81 94 75
         C82 71 70 66 62 58
         C70 42 84 30 100 14 Z"/>
    <!-- Petiole. -->
    <path d="M96 228 C96 236 95 243 92 250 L108 250 C105 243 104 236 104 228 Z"/>
  </g>
</svg>
